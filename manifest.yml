---
applications:
- name: async
  # command: node app.js
  command: python app.py
  instances: 1
  memory: 128M
  default-route: true
  # buildpack: nodejs_buildpack
  buildpack: python_buildpack
  env: 
    OPTIMIZE_MEMORY: "true"
    SSC_USER: <username>
    SSC_PASSWORD: <password>
    SERVICE_URL: <service-url>
